<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | AI Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .offline-container {
            max-width: 500px;
        }
        .offline-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .btn-retry {
            background: white;
            color: #4361ee;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-retry:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">
            <i class="fas fa-wifi-slash"></i>
        </div>
        <h1 class="display-5 fw-bold mb-3">You're Offline</h1>
        <p class="lead mb-4">Looks like you've lost your internet connection. Some features may not be available.</p>
        
        <div class="mb-4">
            <h5>What you can do:</h5>
            <ul class="list-unstyled">
                <li><i class="fas fa-check-circle me-2"></i>View cached portfolio content</li>
                <li><i class="fas fa-check-circle me-2"></i>Read previous conversations</li>
                <li><i class="fas fa-times-circle me-2"></i>AI features require internet</li>
            </ul>
        </div>
        
        <div class="d-flex gap-3 justify-content-center">
            <button class="btn btn-retry" onclick="location.reload()">
                <i class="fas fa-redo me-2"></i>Retry Connection
            </button>
            <button class="btn btn-outline-light" onclick="history.back()">
                <i class="fas fa-arrow-left me-2"></i>Go Back
            </button>
        </div>
        
        <div class="mt-5">
            <small>Your data will sync when you're back online</small>
        </div>
    </div>
    
    <script>
        // Check connection status
        function checkConnection() {
            if (navigator.onLine) {
                window.location.href = '/';
            }
        }
        
        // Check every 5 seconds
        setInterval(checkConnection, 5000);
        
        // Listen for connection changes
        window.addEventListener('online', checkConnection);
    </script>
</body>
</html>
